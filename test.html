<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StegoData Browser Test</title>
    <script src="./dist/stegodata.min.js"></script>
  </head>
  <body>
    <h1>StegoData Browser Test</h1>
    <p id="status">Loading StegoData…</p>
    <script>
      const status = document.getElementById('status');

      if (window.StegoData) {
        const stego = new window.StegoData();
        status.textContent = 'StegoData loaded successfully.';
        console.log('Global library object:', window.StegoDataLib);
        console.log('Direct class instance:', window.StegoData);
        console.log('Stego instance created successfully!', stego);
      } else {
        status.textContent = 'StegoData did not load correctly.';
        console.error('StegoData was not exposed on the window object.');
      }
    </script>
  </body>
</html>
